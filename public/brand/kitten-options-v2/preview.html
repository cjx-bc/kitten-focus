function select(id){const item=options.find(e=>e.id===id);document.querySelectorAll('.option').forEach(e=>e.setAttribute('aria-pressed',e.dataset.id===id?'true':'false'));document.querySelector('.detail-art').innerHTML=item.svg;document.querySelector('.detail-title').textContent=item.id+' · '+item.name;document.querySelector('.detail-description').textContent=item.description;document.querySelector('.sizes').innerHTML=[32,48,64].map(s=>'<div><div style="--s:'+s+'px">'+item.svg+'</div><div class="size-label">'+s+' px</div></div>').join('');document.querySelector('.selection').textContent='当前查看：'+item.id+' · '+item.name;}
document.querySelectorAll('.option').forEach(e=>e.addEventListener('click',()=>select(e.dataset.id)));select('A');
