services:
  updates:
    image: nginx@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    container_name: kitten-focus-updates
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/srv/public:ro
      - ./challenges:/srv/challenges:ro
      - ./certificates:/etc/letsencrypt:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/.well-known/acme-challenge/health']
      interval: 60s
      timeout: 5s
      retries: 3
