server {
    listen 80;
    server_name 47.251.9.162 focus.linma.asia download-focus.linma.asia;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /srv/challenges; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name focus.linma.asia;
    ssl_certificate /etc/letsencrypt/live/focus.linma.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focus.linma.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/public;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=604800" always;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location ~ ^/updates/([a-z0-9-]+)\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0";
        try_files /updates/domain-$1.json =404;
    }
    location = /download {
        add_header Cache-Control "no-store";
        return 302 https://download-focus.linma.asia/download;
    }
    location = / { add_header Cache-Control "public, max-age=300"; try_files /site/index.html =404; }
    location /site/ { try_files $uri =404; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name download-focus.linma.asia;
    ssl_certificate /etc/letsencrypt/live/focus.linma.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focus.linma.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/public;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=604800" always;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /download { add_header Cache-Control "no-store"; return 302 /releases/xiaomao-focus-0.3.1-debug.apk; }
    location /releases/ {
        types { application/vnd.android.package-archive apk; }
        add_header Access-Control-Allow-Origin "https://focus.linma.asia" always;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    server_name 47.251.9.162;
    ssl_certificate /etc/letsencrypt/live/47.251.9.162/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.251.9.162/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/public;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=604800" always;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location /updates/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /releases/ {
        types { application/vnd.android.package-archive apk; }
        add_header Access-Control-Allow-Origin "https://focus.linma.asia" always;
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }
    location / { return 404; }
}
