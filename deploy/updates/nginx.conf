server {
    listen 80;
    server_name 47.251.9.162;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /srv/challenges; }
    location / { return 308 https://47.251.9.162$request_uri; }
}
server {
    listen 443 ssl;
    server_name 47.251.9.162;
    ssl_certificate /etc/letsencrypt/live/47.251.9.162/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.251.9.162/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/public;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=604800" always;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location /updates/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /releases/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }
    location / { return 404; }
}
